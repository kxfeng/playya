<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>小熊拼图书</title>
<meta name="theme-color" content="#eccb9f">
<meta name="apple-mobile-web-app-title" content="拼图书">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--ink:#4b3426;--pink:#ff8fb1;--red:#ef4444;--yellow:#ffd23f;--paper:#fffdf6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;color:var(--ink);
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
body{background:#eccb9f repeating-linear-gradient(90deg,#efcfa5 0 118px,#e2bb8b 118px 121px,#eac79a 121px 236px,#e0b886 236px 239px)}
.tf{font-family:"ZCOOL KuaiLe","PingFang SC","Hiragino Sans GB",sans-serif}
button{font:inherit;color:inherit;border:0;cursor:pointer}

/* ---------- home ---------- */
#home{position:fixed;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:max(20px,env(safe-area-inset-top)) 16px 40px;display:flex;flex-direction:column;align-items:center}
.cover{position:relative;width:min(760px,100%);border-radius:22px;padding:26px 20px 22px;text-align:center;
  background:linear-gradient(#ffc6d9 0 62%,#ffe27a 62%);box-shadow:0 10px 0 #d9a7b8,0 16px 30px rgba(0,0,0,.18);overflow:hidden}
.cover::before{content:"";position:absolute;inset:0;opacity:.35;
  background:radial-gradient(circle at 50% 0,transparent 9px,transparent 9px) ,
  repeating-linear-gradient(0deg,transparent 0 58px,#fff 58px 61px),repeating-linear-gradient(90deg,transparent 0 58px,#fff 58px 61px)}
.cover>*{position:relative}
.cover h1{margin:0;font-size:clamp(44px,9vw,84px);color:#e8343f;letter-spacing:4px;
  text-shadow:4px 0 #fff,-4px 0 #fff,0 4px #fff,0 -4px #fff,3px 3px #fff,-3px -3px #fff,3px -3px #fff,-3px 3px #fff,0 8px 0 rgba(0,0,0,.12)}
.cover .sub{display:inline-block;margin-top:8px;background:#fff;border-radius:999px;padding:6px 22px;font-size:clamp(18px,3.4vw,26px);box-shadow:0 3px 0 rgba(0,0,0,.1)}
.cover .sub b{color:#e8343f}
.diff{margin:22px 0 6px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center}
.diff .lab{font-size:22px}
.diff button{font-family:"PingFang SC",system-ui,sans-serif;min-width:64px;height:56px;border-radius:18px;background:#fff;font-size:22px;font-weight:700;box-shadow:0 4px 0 #d8b48a}
.diff button.on{background:#ff8fb1;color:#fff;box-shadow:0 4px 0 #d5668c}
.shelf{width:min(760px,100%);display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:18px;margin-top:16px}
.card{background:#fff;border-radius:20px;padding:10px 10px 12px;box-shadow:0 6px 0 #d8b48a,0 10px 20px rgba(0,0,0,.12);text-align:center;transition:transform .12s}
.card:active{transform:scale(.96)}
.card .th{border-radius:12px;overflow:hidden;aspect-ratio:1;border:3px solid #f3e6d0}
.card .th svg{display:block;width:100%;height:100%}
.card .nm{margin-top:8px;font-size:22px}
.card .st{font-size:18px;min-height:22px;color:#e8a100}

/* ---------- game ---------- */
#game{position:fixed;inset:0;touch-action:none}
header{position:absolute;left:0;right:0;top:env(safe-area-inset-top,0px);height:68px;display:flex;align-items:center;gap:10px;padding:10px max(14px,env(safe-area-inset-left));}
.pill{height:48px;min-width:48px;padding:0 16px;border-radius:24px;background:#fff;font-size:20px;font-weight:700;box-shadow:0 4px 0 #d8b48a;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.pill:active{transform:translateY(2px);box-shadow:0 2px 0 #d8b48a}
.pill.on{background:#ffe27a}
header .ttl{flex:1;text-align:center;font-size:clamp(22px,3.4vw,32px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .cnt{font-size:20px;background:rgba(255,255,255,.7);padding:6px 14px;border-radius:999px}
#book{position:absolute;filter:drop-shadow(0 8px 0 rgba(120,80,40,.25)) drop-shadow(0 14px 18px rgba(0,0,0,.15))}
.page{position:absolute;top:0;height:100%;width:50%}
.page.l{left:0;border-radius:18px 4px 4px 18px}
.page.r{right:0;border-radius:4px 18px 18px 4px;background:var(--paper)}
.page.l::after{content:"";position:absolute;top:0;right:0;width:22px;height:100%;background:linear-gradient(90deg,transparent,rgba(0,0,0,.12))}
.page.r::before{content:"";position:absolute;top:0;left:0;width:22px;height:100%;background:linear-gradient(270deg,transparent,rgba(0,0,0,.10));z-index:1;pointer-events:none}
.bubble{position:absolute;background:#fff;border-radius:999px;display:flex;align-items:center;gap:8px;padding:0 14px 0 22px;box-shadow:0 3px 0 rgba(0,0,0,.08)}
.bubble::after{content:"";position:absolute;right:16%;bottom:-14px;border:10px solid transparent;border-top:16px solid #fff;border-bottom:0}
.bubble .tx{flex:1;line-height:1.35}
.bubble .spk{flex:none;width:44px;height:44px;border-radius:50%;background:#ffe27a;font-size:22px}
#refPic{position:absolute;background:#fff;border:4px solid #fff;border-radius:8px;overflow:hidden;box-shadow:0 3px 0 rgba(0,0,0,.1)}
#refPic svg,#boardPic svg{display:block;width:100%;height:100%}
#board{position:absolute;z-index:2}
#boardCv,#boardPic{position:absolute;left:0;top:0;width:100%;height:100%;border-radius:4px}
#boardPic{opacity:0;transition:opacity .6s;pointer-events:none}
#boardPic.show{opacity:1}
#tray{position:absolute;border:3px dashed rgba(255,255,255,.75);border-radius:26px;background:rgba(255,255,255,.14)}
#pieces{position:fixed;inset:0;pointer-events:none;z-index:50}
#pieces canvas{position:absolute;left:0;top:0;pointer-events:auto;touch-action:none;will-change:transform;
  filter:drop-shadow(0 2px 2px rgba(0,0,0,.28))}
#pieces canvas.drag{filter:drop-shadow(0 10px 10px rgba(0,0,0,.32))}
#pieces canvas.placed{filter:none;pointer-events:none}
#fx{position:fixed;inset:0;pointer-events:none;z-index:200;width:100%;height:100%}
#toast{position:fixed;left:50%;top:84px;transform:translate(-50%,-20px);opacity:0;background:#fff;padding:10px 26px;border-radius:999px;font-size:24px;box-shadow:0 4px 0 #d8b48a;z-index:150;transition:.25s;pointer-events:none}
#toast.show{opacity:1;transform:translate(-50%,0)}
#win{position:fixed;inset:0;background:rgba(60,30,10,.35);display:flex;align-items:center;justify-content:center;z-index:180}
#win[hidden]{display:none}
#win .box{background:#fff;border-radius:28px;padding:28px 34px 26px;text-align:center;box-shadow:0 10px 0 #e3b9c8;animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
#win .stars{font-size:54px;letter-spacing:6px}
#win h2{margin:6px 0 4px;font-size:46px;color:#e8343f}
#win p{margin:0 0 18px;font-size:22px}
#win .btns{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
#win .btns .pill{height:58px;font-size:22px;padding:0 24px}
#win .btns .go{background:#ff8fb1;color:#fff;box-shadow:0 4px 0 #d5668c}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
[hidden]{display:none!important}

.cover{padding:10px 16px 18px}
#coverArt{display:block;width:100%;height:auto;max-height:240px}
.diff{margin:6px 0 0}
.diff button{width:84px;height:88px;border-radius:22px;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:24px;line-height:1}
.diff button svg{width:40px;height:40px}
.card{position:relative}
.card .badge{position:absolute;right:-8px;top:-10px;width:46px;height:46px;filter:drop-shadow(0 3px 0 rgba(0,0,0,.15))}
header{justify-content:space-between}
.ibtn{width:60px;height:60px;border-radius:50%;background:#fff;box-shadow:0 4px 0 #d8b48a;display:inline-flex;align-items:center;justify-content:center;flex:none}
.ibtn:active{transform:translateY(2px);box-shadow:0 2px 0 #d8b48a}
.ibtn svg{width:34px;height:34px}
.ibtn.on{background:#ffe27a}
.ibtn.big{width:104px;height:104px;box-shadow:0 6px 0 #d8b48a}
.ibtn.big svg{width:58px;height:58px}
.ibtn.go{background:#ff8fb1;box-shadow:0 6px 0 #d5668c}
header .sp{flex:1}
#win{position:fixed;left:0;right:0;bottom:max(6%,env(safe-area-inset-bottom));inset-block-start:auto;background:none;display:flex;gap:28px;justify-content:center;align-items:center;z-index:190;animation:pop .5s cubic-bezier(.3,1.6,.5,1)}

#book{position:static;filter:none}
.page{position:absolute;width:auto;filter:drop-shadow(0 6px 0 rgba(120,80,40,.22)) drop-shadow(0 10px 14px rgba(0,0,0,.12))}
.page.l,.page.r{border-radius:18px;right:auto}
.page.l::after,.page.r::before{display:none}
.diff button.lv{width:auto;min-width:118px;height:96px;padding:6px 14px;border-radius:24px;flex-direction:column;gap:6px;background:#fff;box-shadow:0 5px 0 #d8b48a}
.diff button.lv.on{background:var(--lc);box-shadow:0 5px 0 rgba(0,0,0,.18)}
.diff button.lv .stars{display:flex;gap:2px}
.diff button.lv .stars svg{width:30px;height:30px}
.diff button.lv>svg{width:38px;height:38px}
.shelf{grid-template-columns:repeat(auto-fit,minmax(200px,320px));justify-content:center}
#home{gap:2.4vh;padding-top:max(14px,2vh)}
.cover,.shelf{flex:none}
.cover{padding:8px 16px 14px}
#coverArt{max-height:max(110px,24vh)}
.diff{margin:0}
.shelf{margin-top:0;grid-template-columns:repeat(auto-fit,minmax(150px,min(320px,max(150px,calc(100vh - 24vh - 220px)))))}
header{z-index:60;pointer-events:none}
header .ibtn{pointer-events:auto}
.shelf{grid-template-columns:repeat(4,minmax(0,1fr));width:min(760px,100%,calc((100vh - 24vh - 250px)*4 + 54px));gap:14px}
.card{padding:7px}
#home .cover{margin-top:auto}
#home .shelf{margin-bottom:auto}
#home{padding-bottom:max(14px,2vh)}
</style>
</head>
<body>

<div id="home">
  <div class="cover">
    <svg id="coverArt" viewBox="0 0 760 230" aria-hidden="true"></svg>
    <div class="diff" id="diff"></div>
  </div>
  <div class="shelf" id="shelf"></div>
</div>

<div id="game" hidden>
  <header>
    <span class="sp"></span>
    <button class="ibtn" id="btnHome" aria-label="回书架"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M7 23 24 8l17 15v18H30V30H18v11H7z" fill="#ff8fb1" stroke="#4b3426" stroke-width="3.5" stroke-linejoin="round"/></svg></button>
    <button class="ibtn" id="btnSound" aria-label="声音"></button>
  </header>
  <div id="book">
    <div class="page l" id="pageL"><div id="refPic"></div></div>
    <div class="page r" id="pageR"><div id="board"><canvas id="boardCv"></canvas><div id="boardPic"></div></div></div>
  </div>
  <div id="tray"></div>
</div>
<div id="pieces"></div>
<canvas id="fx"></canvas>
<div id="toast" class="tf"></div>
<div id="win" hidden>
  <button class="ibtn big" id="btnShelf" aria-label="回书架"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M7 23 24 8l17 15v18H30V30H18v11H7z" fill="#ff8fb1" stroke="#4b3426" stroke-width="3.5" stroke-linejoin="round"/></svg></button>
  <button class="ibtn big" id="btnAgain" aria-label="再玩一次"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M36 18a14 14 0 1 0 2 12" fill="none" stroke="#4b3426" stroke-width="5" stroke-linecap="round"/><path d="M28 8l11 2-3 11z" fill="#4b3426" stroke="#4b3426" stroke-width="3" stroke-linejoin="round"/></svg></button>
  <button class="ibtn big go" id="btnNext" aria-label="下一张"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M12 8 38 24 12 40z" fill="#fff" stroke="#4b3426" stroke-width="4" stroke-linejoin="round"/></svg></button>
</div>

<script>
'use strict';
/* ================= drawing kit (original art) ================= */
const O='#4b3426';
const SW=`stroke="${O}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"`;
const g=(x,y,s,c,r=0)=>`<g transform="translate(${x} ${y}) rotate(${r}) scale(${s})">${c}</g>`;
const limb=(d,c,w=9)=>`<path d="${d}" fill="none" stroke="${O}" stroke-width="${w+6}"/><path d="${d}" fill="none" stroke="${c}" stroke-width="${w}"/>`;
const blob=(cs,fill)=>cs.map(([x,y,r])=>`<circle cx="${x}" cy="${y}" r="${r+1.5}" fill="${O}" stroke="none"/>`).join('')+cs.map(([x,y,r])=>`<circle cx="${x}" cy="${y}" r="${r-1.5}" fill="${fill}" stroke="none"/>`).join('');
const starPts=(R,r,n=5)=>{let s='';for(let i=0;i<n*2;i++){const a=-Math.PI/2+i*Math.PI/n,q=i%2?r:R;s+=(i?'L':'M')+(Math.cos(a)*q).toFixed(1)+','+(Math.sin(a)*q).toFixed(1);}return s+'Z';};
const eye=(x,y,r=3)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${O}" stroke="none"/><circle cx="${x+r*.35}" cy="${y-r*.35}" r="${r*.38}" fill="#fff" stroke="none"/>`;

const sun=()=>{let r='';for(let i=0;i<8;i++){const a=i*Math.PI/4;r+=`<line x1="${(Math.cos(a)*23).toFixed(1)}" y1="${(Math.sin(a)*23).toFixed(1)}" x2="${(Math.cos(a)*33).toFixed(1)}" y2="${(Math.sin(a)*33).toFixed(1)}"/>`;}
  return `<g stroke="#f4a100" stroke-width="4">${r}</g><circle r="18" fill="#ffd60a"/>${eye(-6,-3,2.2)}${eye(6,-3,2.2)}<path d="M-6,5 Q0,10 6,5" fill="none" stroke-width="2"/><ellipse cx="-11" cy="4" rx="3" ry="2" fill="#ff9aa8" stroke="none"/><ellipse cx="11" cy="4" rx="3" ry="2" fill="#ff9aa8" stroke="none"/>`;};
const cloud=()=>blob([[-20,4,12],[-2,-6,17],[18,2,13],[2,8,11]],'#fff');
const bush=()=>blob([[-18,0,14],[0,-8,17],[18,0,14]],'#58b84f')+`<g stroke="none"><circle cx="-12" cy="-6" r="3.5" fill="#fff"/><circle cx="6" cy="-14" r="3.5" fill="#ffb3c7"/><circle cx="16" cy="-2" r="3.5" fill="#fff"/><circle cx="-2" cy="2" r="3" fill="#ffe27a"/></g>`;
const ball=()=>`<circle r="14" fill="#ffd23f"/><path d="M0,0 L-14,0 A14,14 0 0 1 0,-14 Z" fill="#ef4444" stroke="none"/><path d="M0,0 L14,0 A14,14 0 0 1 0,14 Z" fill="#3b82f6" stroke="none"/><circle r="14" fill="none"/><circle cx="-5" cy="-6" r="3" fill="#fff" stroke="none" opacity=".8"/>`;
const crayon=c=>`<g transform="rotate(-60)"><rect x="-16" y="-5" width="26" height="10" rx="2" fill="${c}"/><path d="M10,-5 L20,0 L10,5 Z" fill="${c}"/><line x1="-8" y1="-5" x2="-8" y2="5" stroke-width="2"/><line x1="2" y1="-5" x2="2" y2="5" stroke-width="2"/></g>`;
const balloon=c=>`<path d="M0,0 Q-8,-40 0,-80" fill="none" stroke-width="2"/><path d="M-3,-79 L3,-79 L0,-84Z" fill="${c}" stroke-width="2"/><ellipse cx="0" cy="-102" rx="16" ry="20" fill="${c}"/><ellipse cx="-6" cy="-109" rx="4" ry="6" fill="#fff" opacity=".6" stroke="none"/>`;
const car=c=>`<path d="M-28,-8 V-20 Q-28,-24 -22,-24 H-12 L-4,-34 H12 L20,-24 H24 Q28,-24 28,-18 V-8 Z" fill="${c}"/><path d="M-9,-24 L-3,-31 H3 V-24Z M7,-24 V-31 H11 L16,-24Z" fill="#cdeeff" stroke-width="2"/><circle cx="-15" cy="-7" r="7" fill="#444"/><circle cx="15" cy="-7" r="7" fill="#444"/><circle cx="-15" cy="-7" r="2.5" fill="#ddd" stroke="none"/><circle cx="15" cy="-7" r="2.5" fill="#ddd" stroke="none"/>`;
const block=(x,y,c)=>`<rect x="${x}" y="${y}" width="24" height="24" rx="3" fill="${c}"/><circle cx="${x+12}" cy="${y+12}" r="5" fill="#fff" stroke="none" opacity=".85"/>`;
const star=(R=18,c='#ffd23f')=>`<path d="${starPts(R,R*.48)}" fill="${c}"/>`;

function bear(o={}){
  const fur=o.fur||'#d9a46c',shirt=o.shirt||'#ff9ec0';
  const hand=o.raise?[48,22]:[42,84];
  const armR=o.raise?'M27,52 Q44,44 48,22':'M27,52 Q44,66 42,84';
  return `<ellipse cx="-15" cy="106" rx="14" ry="8" fill="${fur}"/><ellipse cx="15" cy="106" rx="14" ry="8" fill="${fur}"/>
  <path d="M-30,34 C-38,80 -32,102 -18,104 L18,104 C32,102 38,80 30,34 Z" fill="${shirt}"/>
  <path d="M0,86 C-12,77 -13,66 -6,64 C-3,63 0,66 0,68 C0,66 3,63 6,64 C13,66 12,77 0,86Z" fill="#fff" stroke-width="2"/>
  ${o.ring||''}
  ${limb('M-27,52 Q-44,66 -42,84',fur)}<circle cx="-42" cy="84" r="7" fill="${fur}"/>
  ${limb(armR,fur)}
  ${o.hold?`<g transform="translate(${hand[0]} ${hand[1]})">${o.hold}</g>`:''}
  <circle cx="${hand[0]}" cy="${hand[1]}" r="7" fill="${fur}"/>
  <circle cx="-27" cy="-27" r="13" fill="${fur}"/><circle cx="27" cy="-27" r="13" fill="${fur}"/>
  <circle cx="-27" cy="-27" r="6" fill="#f6c5a0" stroke="none"/><circle cx="27" cy="-27" r="6" fill="#f6c5a0" stroke="none"/>
  <circle r="38" fill="${fur}"/>
  <ellipse cx="0" cy="13" rx="17" ry="12" fill="#fbe5cc"/>
  <ellipse cx="0" cy="7" rx="6" ry="4.2" fill="${O}" stroke="none"/>
  <path d="M-6,15 Q0,21 6,15" fill="none" stroke-width="2.5"/>
  ${eye(-14,-6,5.5)}${eye(14,-6,5.5)}
  <ellipse cx="-25" cy="9" rx="6" ry="4" fill="#ff8fa3" stroke="none" opacity=".7"/><ellipse cx="25" cy="9" rx="6" ry="4" fill="#ff8fa3" stroke="none" opacity=".7"/>
  ${o.face||''}${o.hat||''}`;
}
const santaHat=()=>`<path d="M-36,-20 C-30,-64 20,-76 48,-46 L34,-20 Z" fill="#e53935"/><circle cx="49" cy="-45" r="8" fill="#fff"/><path d="M-39,-22 Q0,-36 39,-21 L37,-11 Q0,-25 -37,-12 Z" fill="#fff"/>`;
const ring=()=>`<ellipse cx="0" cy="72" rx="44" ry="15" fill="#ff7aa8"/><path d="M-30,62 l6,21 M0,58 v29 M30,62 l-6,21" stroke="#fff" stroke-width="7"/><ellipse cx="0" cy="72" rx="44" ry="15" fill="none"/>`;
const shades=()=>`<g stroke-width="2.5"><rect x="-25" y="-13" width="19" height="12" rx="4" fill="#26323a"/><rect x="6" y="-13" width="19" height="12" rx="4" fill="#26323a"/><line x1="-6" y1="-8" x2="6" y2="-8"/></g>`;

const cat=()=>`${limb('M18,-8 C40,-10 44,-34 32,-44','#9aa3ab',8)}
<path d="M-22,0 C-27,-28 -18,-44 0,-44 C18,-44 27,-28 22,0 Z" fill="#9aa3ab"/>
<ellipse cx="0" cy="-16" rx="11" ry="14" fill="#f3e6bf" stroke="none"/>
<path d="M-21,-64 L-19,-88 L-4,-75 Z" fill="#9aa3ab"/><path d="M21,-64 L19,-88 L4,-75 Z" fill="#9aa3ab"/>
<ellipse cx="0" cy="-58" rx="25" ry="20" fill="#9aa3ab"/>
<ellipse cx="0" cy="-51" rx="12" ry="7" fill="#f3e6bf" stroke="none"/>
<path d="M-6,-75 L-6,-69 M0,-77 L0,-70 M6,-75 L6,-69" stroke="#5f6870" stroke-width="2.5"/>
${eye(-10,-60,3.5)}${eye(10,-60,3.5)}
<path d="M-2.5,-55 L2.5,-55 L0,-52 Z" fill="#ff8a9a" stroke-width="1.5"/>
<path d="M-5,-48 Q-2,-45 0,-50 Q2,-45 5,-48" fill="none" stroke-width="2"/>

function side(p,x0,y0,x1,y1,t,m){if(!t){p.lineTo(x1,y1);return;}
  const L=Math.hypot(x1-x0,y1-y0),ux=(x1-x0)/L,uy=(y1-y0)/L,nx=uy,ny=-ux,H=t*.26*m,c=L/2;
  const P=(a,b)=>[x0+ux*(c+a*m)+nx*b*H,y0+uy*(c+a*m)+ny*b*H];
  p.lineTo(...P(-.14,0));
  p.bezierCurveTo(...P(-.08,0),...P(-.04,.25),...P(-.09,.45));
  p.bezierCurveTo(...P(-.17,.72),...P(-.13,1.05),...P(0,1.05));
  p.bezierCurveTo(...P(.13,1.05),...P(.17,.72),...P(.09,.45));
  p.bezierCurveTo(...P(.04,.25),...P(.08,0),...P(.14,0));
  p.lineTo(x1,y1);}
function piecePath(w,h,e,m){const p=new Path2D();p.moveTo(0,0);side(p,0,0,w,0,e[0],m);side(p,w,0,w,h,e[1],m);side(p,w,h,0,h,e[2],m);side(p,0,h,0,0,e[3],m);p.closePath();return p;}

  const areas=regs.map(r=>(r.x1-r.x0)*(r.y1-r.y0)),tot=areas.reduce((a,b)=>a+b,0);

async function startScene(i){
  const my=++busy;
  state.sc=i;state.ghost=false;G.done=false;G.hl=null;drags.clear();
  const sc=SCENES[i],[cols,rows]=LEVELS[state.lv].grid;G.cols=cols;G.rows=rows;
  G.hE=[...Array(rows-1)].map(()=>[...Array(cols)].map(rnd));
  G.vE=[...Array(rows)].map(()=>[...Array(cols-1)].map(rnd));
  $('#pieces').innerHTML='';G.pieces=[];G.occ=Array(rows*cols).fill(null);
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)G.pieces.push({r,c,idx:r*cols+c,el:document.createElement('canvas'),x:0,y:0,slot:null});
  $('#home').hidden=true;$('#game').hidden=false;$('#win').hidden=true;
  $('#refPic').innerHTML=sceneSVG(sc);$('#boardPic').innerHTML=sceneSVG(sc);$('#boardPic').classList.remove('show');
    layout();drawBoard();
  G.img=await loadImg(sceneSVG(sc,1200));
  if(my!==busy)return;
  computeSig();drawBoard();
  const box=$('#pieces');
  for(const pc of G.pieces){renderPiece(pc);box.appendChild(pc.el);place(pc,...slotPos(pc.idx));pc.el.style.zIndex=++zTop;}
  scatterPositions(G.pieces);
  setTimeout(()=>{if(my!==busy)return;G.pieces.forEach((pc,k)=>{pc.el.style.transition=`transform .7s cubic-bezier(.3,1.3,.5,1) ${k*25}ms`;place(pc,...pc.home);});
    setTimeout(()=>G.pieces.forEach(pc=>pc.el.style.transition='none'),900+G.pieces.length*25);},700);
}

function onResize(){if($('#game').hidden)return;
  dpr=Math.min(devicePixelRatio||1,2.5);layout();drawBoard();
  const loose=[];for(const pc of G.pieces){renderPiece(pc);pc.el.style.transition='none';if(pc.slot!=null)place(pc,...slotPos(pc.slot));else loose.push(pc);}
  scatterPositions(loose);loose.forEach(pc=>place(pc,...pc.home));
}
let rzT;addEventListener('resize',()=>{clearTimeout(rzT);rzT=setTimeout(onResize,120);});

/* drag: any slot accepts any piece; dropping on an occupied slot swaps */
const drags=new Map();
function pick(X,Y){if(G.done)return null;const busyP=new Set([...drags.values()].map(d=>d.pc));
  const list=G.pieces.filter(p=>!busyP.has(p)).sort((a,b)=>(+b.el.style.zIndex)-(+a.el.style.zIndex));
  for(const pc of list){if(hitCtx.isPointInPath(pc.path,X-pc.x-G.p,Y-pc.y-G.p))return pc;}return null;}
$('#pieces').addEventListener('pointerdown',e=>{
  const pc=pick(e.clientX,e.clientY);if(!pc)return;e.preventDefault();
  const from={slot:pc.slot,x:pc.x,y:pc.y};
  if(pc.slot!=null){G.occ[pc.slot]=null;pc.slot=null;}
  drags.set(e.pointerId,{pc,from,ox:e.clientX-pc.x,oy:e.clientY-pc.y});
  pc.el.style.transition='none';pc.el.style.zIndex=++zTop;pc.el.classList.add('drag');
  try{pc.el.setPointerCapture(e.pointerId);}catch(_){}
  sfx.pick();
});
addEventListener('pointermove',e=>{const d=drags.get(e.pointerId);if(!d)return;e.preventDefault();
  place(d.pc,...clampPos(d.pc,e.clientX-d.ox,e.clientY-d.oy));const k=nearSlot(d.pc);setHl(k>=0?{k,pc:d.pc}:null);},{passive:false});
function putSlot(pc,k,ms=160){pc.slot=k;G.occ[k]=pc;pc.el.style.transition=`transform ${ms}ms ease-out`;place(pc,...slotPos(k));pc.el.style.zIndex=(same(pc.idx,k)?0:50000)+(++zSlot);}
function endDrag(e){const d=drags.get(e.pointerId);if(!d)return;drags.delete(e.pointerId);const pc=d.pc;pc.el.classList.remove('drag');
  setHl(null);
  const k=nearSlot(pc);
  if(k<0){sfx.drop();return;}
  const q=G.occ[k];
  if(q&&q!==pc){
    G.occ[k]=null;q.slot=null;
    if(d.from.slot!=null&&!G.occ[d.from.slot])putSlot(q,d.from.slot,300);
    else{q.el.style.transition='transform .3s ease-out';q.el.style.zIndex=++zTop;place(q,d.from.x,d.from.y);}
  }
  putSlot(pc,k);
  if(same(pc.idx,k)){sfx.good();const [sx,sy]=slotPos(k);miniBurst(sx+G.p+G.w/2,sy+G.p+G.h/2);}else sfx.snap();
    check();
}
addEventListener('pointerup',endDrag);addEventListener('pointercancel',endDrag);

function computeSig(){G.sig=null;try{const N=12,c=document.createElement('canvas');c.width=G.cols*N;c.height=G.rows*N;const x=c.getContext('2d');x.drawImage(G.img,0,0,c.width,c.height);const d=x.getImageData(0,0,c.width,c.height).data;const sg=[];
  for(let r=0;r<G.rows;r++)for(let cc=0;cc<G.cols;cc++){const a=[];for(let y=0;y<N;y++)for(let xx=0;xx<N;xx++){const i=((r*N+y)*c.width+cc*N+xx)*4;a.push(d[i],d[i+1],d[i+2]);}sg.push(a);}G.sig=sg;}catch(e){G.sig=null;}}
function same(i,j){if(i===j)return true;if(!G.sig)return false;const a=G.sig[i],b=G.sig[j];let t=0;for(let k=0;k<a.length;k++)t+=Math.abs(a[k]-b[k]);return t/a.length<4;}
function check(){
  if(G.occ.every((q,k)=>q&&same(q.idx,k))){finish();return;}
  if(G.occ.every(Boolean))setTimeout(()=>{if(G.done)return;tone(330,.12,'triangle',.12);tone(262,.16,'triangle',.12,.12);
    G.occ.forEach((q,k)=>{if(q&&!same(q.idx,k)&&q.el.animate){const t=`translate(${q.x}px,${q.y}px)`;
      q.el.animate([0,-9,9,-6,6,0].map(a=>({transform:`${t} rotate(${a}deg)`})),{duration:650,easing:'ease-in-out'});}});},380);
}

/* celebration: fireworks, no text */
let NB=null;
function boom(){if(!state.sound)return;const a=ac();if(!a)return;
  if(!NB){NB=a.createBuffer(1,Math.floor(a.sampleRate*.6),a.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,3);}
  const s=a.createBufferSource(),gn=a.createGain(),f=a.createBiquadFilter();f.type='lowpass';f.frequency.value=700+Math.random()*600;s.buffer=NB;gn.gain.value=.4;s.connect(f).connect(gn).connect(a.destination);s.start();}
function firework(x,y){const c1=COLS[Math.random()*6|0],c2=COLS[Math.random()*6|0],n=56,sp=2.6+Math.random()*1.6;
  for(let i=0;i<n;i++){const a=i/n*Math.PI*2,v=sp*(.75+Math.random()*.5);parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,g:.05,drag:.975,s:5+Math.random()*3,rot:0,vr:0,c:i%2?c1:c2,life:55+Math.random()*25,dot:true});}
  boom();fxKick();}
function miniBurst(x,y){const c1=COLS[Math.random()*6|0],c2=COLS[Math.random()*6|0];
  for(let i=0;i<26;i++){const a=i/26*Math.PI*2,v=2.2+Math.random()*1.4;parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,g:.04,drag:.94,s:4+Math.random()*3,rot:0,vr:0,c:i%2?c1:c2,life:30+Math.random()*14,dot:true});}
  for(let i=0;i<5;i++){const a=Math.random()*Math.PI*2;parts.push({x,y,vx:Math.cos(a)*2,vy:Math.sin(a)*2-1,g:.06,s:9,rot:0,vr:.12,c:COLS[i],life:34,star:true});}fxKick();}
function fireworks(){const W=innerWidth,H=innerHeight;
  for(let i=0;i<9;i++)setTimeout(()=>firework(W*(.15+Math.random()*.7),H*(.12+Math.random()*.45)),i*320);
  setTimeout(confetti,600);}
function finish(){if(G.done)return;G.done=true;
  G.pieces.forEach(pc=>pc.el.classList.add('placed'));
  const sc=SCENES[state.sc];state.done[sc.id]=1;store.set('done',state.done);
  setTimeout(()=>{$('#boardPic').classList.add('show');sfx.win();fireworks();say('哇，太棒了！');},350);
  setTimeout(()=>{$('#pieces').innerHTML='';},1100);
  setTimeout(()=>{if(G.done&&!$('#game').hidden)$('#win').hidden=false;},2800);
}

/* ui */
$('#btnHome').onclick=()=>{busy++;G.done=true;$('#pieces').innerHTML='';G.pieces=[];$('#game').hidden=true;$('#win').hidden=true;renderHome();$('#home').hidden=false;};
const updSound=()=>{$('#btnSound').innerHTML=state.sound?ICON_SND_ON:ICON_SND_OFF;};
$('#btnSound').onclick=()=>{state.sound=!state.sound;store.set('sound',state.sound);updSound();if(!state.sound)try{speechSynthesis.cancel();}catch(e){}};
$('#btnShelf').onclick=()=>$('#btnHome').onclick();
$('#btnAgain').onclick=()=>startScene(state.sc);
$('#btnNext').onclick=()=>{const l=LEVELS[state.lv].scenes,k=l.indexOf(state.sc);startScene(l[(k+1)%l.length]);};

const pz=(x,y,s,c,r)=>`<g transform="translate(${x} ${y}) rotate(${r}) scale(${s})"><path d="M-20,-20 h14 a6,6 0 1 1 12,0 h14 v14 a6,6 0 1 1 0,12 v14 h-40 z" fill="${c}"/></g>`;
const gridIcon=(c,r)=>{let s='';const w=36/c,h=36/r;for(let i=0;i<r;i++)for(let j=0;j<c;j++)s+=`<rect x="${6+j*w+1}" y="${6+i*h+1}" width="${w-2}" height="${h-2}" rx="2" fill="${(i+j)%2?'#ffd23f':'#8fd0f5'}"/>`;return `<svg viewBox="0 0 48 48" aria-hidden="true">${s}</svg>`;};
const BADGE=`<svg class="badge" viewBox="-24 -24 48 48" aria-hidden="true"><path d="${starPts(22,10.5)}" fill="#ffd23f" stroke="${O}" stroke-width="3" stroke-linejoin="round"/></svg>`;
function renderHome(){
  $('#coverArt').innerHTML=`<g ${SW}>${pz(110,70,1.7,'#ffd23f',-15)}${pz(650,66,1.6,'#4fc3f7',20)}${pz(215,170,1.25,'#8bd17c',10)}${pz(545,172,1.35,'#ff8a65',-20)}${pz(60,185,1,'#a78bfa',30)}${pz(705,182,1.05,'#ff8fb1',-10)}${pz(300,60,.8,'#ff8fb1',25)}${pz(462,58,.8,'#8bd17c',-25)}${g(380,58,1.12,bear({shirt:'#ff9ec0',raise:true,hold:pz(4,-14,.75,'#ffd23f',-10)}))}</g>`;
  const df=$('#diff');df.innerHTML='';
  LEVELS.forEach((L,i)=>{const b=document.createElement('button');b.className='lv'+(i===state.lv?' on':'');b.setAttribute('aria-label',['简单','中等','难'][i]);
    b.style.setProperty('--lc',L.color);
    b.innerHTML=`<span class="stars">${Array.from({length:i+1},()=>`<svg viewBox="-24 -24 48 48" aria-hidden="true"><path d="${starPts(21,10)}" fill="#ffd23f" stroke="${O}" stroke-width="3.5" stroke-linejoin="round"/></svg>`).join('')}</span>${gridIcon(...L.grid)}`;
    b.onclick=()=>{state.lv=i;store.set('lv',i);renderHome();tone(523+i*130,.1,'triangle',.14);};df.appendChild(b);});
  const sh=$('#shelf');sh.innerHTML='';
  LEVELS[state.lv].scenes.forEach(i=>{const sc=SCENES[i],d=document.createElement('button');d.className='card';d.setAttribute('aria-label',sc.name);
    d.innerHTML=`<div class="th">${sceneSVG(sc)}</div>${state.done[sc.id]?BADGE:''}`;
    d.onclick=()=>startScene(i);sh.appendChild(d);});
}
updSound();renderHome();fxSize();
</script>

if('serviceWorker' in navigator){addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});}
